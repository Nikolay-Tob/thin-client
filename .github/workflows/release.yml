name: Release images

# Manual run: Actions -> "Release images" -> Run workflow.
# Joins the parts of thin-client.img.zip from the given branch, verifies SHA256, builds the VHD
# and publishes a GitHub Release (thin-client.img, thin-client.vhd, SHA256SUMS.txt).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.5
        required: true
      branch:
        description: Branch with the image parts (images/ folder)
        default: images
        required: true
      delete_branch:
        description: Delete the branch with image parts after publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Join parts, verify, unzip
        working-directory: images
        run: |
          cat thin-client.img.zip.part* > thin-client.img.zip
          sha256sum -c SHA256SUMS.txt
          rm -f thin-client.img.zip.part*
          unzip -q thin-client.img.zip
          rm thin-client.img.zip
          ls -lh

      - name: Build VHD (dynamic, 4 GiB virtual size)
        working-directory: images
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-utils
          cp thin-client.img vhd-src.img
          truncate -s 4096M vhd-src.img
          qemu-img convert -f raw -O vpc -o subformat=dynamic,force_size=on vhd-src.img thin-client.vhd
          rm vhd-src.img
          sha256sum thin-client.img thin-client.vhd > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Publish release
        working-directory: images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" thin-client.img thin-client.vhd SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "Thin client $TAG (USB kiosk images)" \
            --notes "Bootable USB thin client (Ubuntu 24.04, RDP/VNC kiosk). thin-client.img: write to a USB stick (dd / Rufus / balenaEtcher in DD mode), BIOS + UEFI/Secure Boot. thin-client.vhd: dynamic VHD (BIOS) for virtual machines. Checksums: SHA256SUMS.txt. 1.5: VNC scaling (fit/stretch/1:1), cursor mode and client choice (TigerVNC/SSVNC), RDP scaling, fixes; 1.4: \"Install to PC\" boot menu entry (installs to an internal disk, BIOS+UEFI); 1.3: F12 opens/hides the settings menu; 1.2: hotkeys fixed (layout switch is CapsLock now); 1.1: network settings persist across reboots."

      - name: Delete the temporary branch
        if: ${{ inputs.delete_branch && inputs.branch != 'main' }}
        env:
          BRANCH: ${{ inputs.branch }}
        run: git push origin --delete "$BRANCH"
